<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f1e9">
  <title>Royal · Storyboards</title>
  <link rel="stylesheet" href="./styles.css?v=9c878c344cfa">
  <script src="./app.js?v=e40bf39644d5" defer></script>
</head>
<body>
  <div class="app">
    <aside id="sidebar" class="sidebar" aria-label="Índice de storyboards">
      <div class="sidebar-head"><strong>ROYAL</strong><button id="closeSidebar" class="icon" type="button" aria-label="Ocultar índice">×</button></div>
      <nav id="contents" aria-label="Capítulos y secuencias"></nav>
      <button id="resetVersions" class="sidebar-reset" type="button">Volver a versiones actuales</button>
    </aside>
    <button id="scrim" class="scrim" type="button" aria-label="Cerrar índice" hidden></button>
    <main class="main">
      <header class="toolbar">
        <button id="toggleSidebar" class="icon" type="button" aria-label="Mostrar u ocultar índice" aria-controls="sidebar" aria-expanded="true">☰</button>
        <div class="heading"><span id="chapterTitle">Royal</span><strong id="sectionTitle">Cargando…</strong></div>
        <div class="controls">
          <label class="control"><span>Versión</span><select id="versionSelect" aria-label="Versión de esta secuencia"></select></label>
          <label class="control"><span>Viñetas/página</span><select id="panelCount" aria-label="Viñetas por página"><option value="1">1</option><option value="2">2</option><option value="4">4</option><option value="6">6</option></select></label>
          <button id="themeToggle" class="icon" type="button" aria-label="Cambiar a tema oscuro" title="Cambiar tema">☾</button>
          <button id="openNotes" class="notes-button" type="button">Notas <span id="noteCount">0</span></button>
          <button id="fullscreen" class="icon fullscreen" type="button" aria-label="Pantalla completa">⛶</button>
        </div>
      </header>
      <div id="versionNote" class="message" hidden></div>
      <div id="errorNote" class="error" role="alert" hidden></div>
      <section id="readingArea" class="reading-area" aria-label="Página del storyboard"><div id="panelGrid" class="panel-grid" aria-live="polite"></div></section>
      <footer class="pagebar">
        <button id="previousPage" class="page-button" type="button" aria-label="Página anterior">← <span>Anterior</span></button>
        <span id="pagePosition">Página 1</span>
        <button id="nextPage" class="page-button" type="button" aria-label="Página siguiente"><span>Siguiente</span> →</button>
      </footer>
    </main>
  </div>
  <dialog id="zoomDialog" class="zoom-dialog" aria-labelledby="zoomTitle">
    <div class="dialog-head"><strong id="zoomTitle"></strong><div><a id="sourceLink" target="_blank" rel="noopener">Lámina original ↗</a><button id="zoomOut" class="icon" type="button" aria-label="Reducir">−</button><span id="zoomLevel">100 %</span><button id="zoomIn" class="icon" type="button" aria-label="Ampliar">+</button><button id="closeZoom" class="icon" type="button" aria-label="Cerrar">×</button></div></div>
    <div id="zoomScroll" class="zoom-scroll"><div id="zoomCanvas" class="zoom-canvas"><img id="zoomImage" alt=""><div id="zoomPins" class="pin-layer"></div></div></div>
  </dialog>
  <dialog id="notesDialog" class="notes-dialog" aria-labelledby="notesTitle">
    <div class="dialog-head"><strong id="notesTitle">Notas</strong><button id="closeNotes" class="icon" type="button" aria-label="Cerrar">×</button></div>
    <p class="notes-intro">Para comentar sin cuenta, pulsa «Añadir nota» y toca una viñeta.</p>
    <div class="notes-toolbar"><button id="addNote" class="primary" type="button">Añadir nota</button><label><input id="allNotes" type="checkbox"> Todas las notas</label></div>
    <p id="notesStatus" class="status" role="status"></p><div id="notesList" class="notes-list"></div>
  </dialog>
  <dialog id="noteDialog" class="note-dialog" aria-labelledby="noteTitle">
    <form id="noteForm">
      <div class="dialog-head"><strong id="noteTitle">Nueva nota</strong><button id="cancelNote" class="icon" type="button" aria-label="Cerrar">×</button></div>
      <p>La nota será visible para todos los lectores.</p>
      <label>Nombre (opcional)<input id="noteAuthor" maxlength="40" autocomplete="name" placeholder="Anónimo"></label>
      <label>Comentario<textarea id="noteBody" maxlength="1000" rows="5" required></textarea></label>
      <input id="noteWebsite" class="honeypot" tabindex="-1" autocomplete="off" aria-hidden="true">
      <p id="noteFormStatus" class="status" role="status"></p>
      <div class="form-actions"><button id="cancelNoteBottom" type="button">Cancelar</button><button id="saveNote" class="primary" type="submit">Guardar nota</button></div>
    </form>
  </dialog>
</body>
</html>
